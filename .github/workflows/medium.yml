name: Update Medium Articles

on:
  schedule:
    - cron: "0 0 * * *"   # runs once daily at midnight UTC
  workflow_dispatch:       # allow manual trigger

permissions:
  contents: write   # ✅ allows GitHub Actions to commit to your repo

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Update Medium posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@samriddhibagchi"
          max_post_count: 2
          commit_message: "Updated Medium articles"
